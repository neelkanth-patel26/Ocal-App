<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Ocal Browser Mobile Edition - Fast, Private, Elegant Mobile Browser">
  <title>Ocal Browser</title>

  <link rel="icon" type="image/png" href="/assets/icon.png">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Core Mobile Stylesheets -->
  <link rel="stylesheet" href="/src/styles/theme.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>

  <div id="app-root">
    <!-- Edge Back Gesture Peek Layer (Reveals previous page from back) -->
    <div class="back-peek-layer" id="back-peek-layer">
      <div class="back-peek-content" id="back-peek-content"></div>
      <div class="back-peek-scrim" id="back-peek-scrim"></div>
    </div>



    <!-- Active Web Viewport (Edge-to-Edge Full-bleed) -->
    <main class="viewport-container" id="viewport-container"></main>

    <!-- Search / URL Focus Backdrop (Frosted Background Blur) -->
    <div class="search-backdrop" id="search-backdrop"></div>

    <!-- Bottom Dock: Two-Layer Architecture -->
    <div class="bottom-dock" id="bottom-dock">

      <!-- Shield Popover Card (Matches Reference Screen 2) -->
      <div class="shield-popover" id="shield-popover">
        <!-- Integrated Header -->
        <div class="shield-popover-header">
          <div class="popover-nav-chevrons">
            <i class="fas fa-chevron-left"></i>
            <i class="fas fa-chevron-right"></i>
          </div>
          <span class="shield-popover-domain" id="shield-popover-domain">dineinstyle.com</span>
          <div class="shield-popover-icons">
            <i class="fas fa-microphone popover-mic-icon"></i>
            <div class="popover-shield-badge active" id="popover-shield-badge">
              <i class="fas fa-bolt"></i>
            </div>
          </div>
        </div>

        <!-- Inset Ad Blocker Stats Box -->
        <div class="shield-popover-body">
          <div class="shield-inset-box">
            <button class="shield-power-toggle active" id="shield-power-toggle" title="Toggle Ad Filter">
              <i class="fas fa-power-off"></i>
            </button>
            <div class="shield-stats-text">
              <span class="shield-big-number" id="shield-popover-count">0</span>
              <span class="shield-label-text">Ads blocked on this site</span>
            </div>
          </div>
          <p class="shield-hint-text">If this site appears broken, try turning off the Ad Filter.</p>
          <button class="shield-advanced-btn" id="shield-popover-advanced">
            <span>Advanced settings</span>
            <i class="fas fa-chevron-down"></i>
          </button>
        </div>
      </div>

      <!-- Downloads Quick Popover Card (Matches Apple Safari / Chrome download bubble) -->
      <div class="dl-quick-popover" id="dl-quick-popover">
        <div class="dl-quick-popover-header">
          <div class="dl-quick-popover-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Downloads</span>
          </div>
          <button class="dl-quick-popover-close" id="dl-popover-close-btn" title="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="dl-quick-popover-body" id="dl-quick-popover-body">
          <!-- Populated dynamically with active / recent downloads -->
        </div>
        <div class="dl-quick-popover-footer">
          <button class="dl-quick-view-all-btn" id="dl-quick-view-all-btn">
            <span>All Downloads</span>
            <i class="fas fa-arrow-right" style="font-size:11px;"></i>
          </button>
        </div>
      </div>

      <!-- Autocomplete Suggestions Overlay -->
      <div class="suggestions-dropdown" id="suggestions-dropdown"></div>

      <!-- Loading Progress Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <!-- Tablet / Large Screen Brand & Home Anchor -->
      <div class="dock-left-brand" id="dock-left-brand" title="Ocal Start Page">
        <span class="brand-logo-text">Ocal</span>
      </div>

      <!-- Layer 1: Floating URL Pill (Matches Reference Screen 1) -->
      <div class="url-capsule-bar" id="url-capsule-bar">
        <button class="capsule-nav-btn" id="nav-back" title="Back" disabled>
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="capsule-nav-btn" id="nav-forward" title="Forward" disabled>
          <i class="fas fa-chevron-right"></i>
        </button>
        <button class="capsule-nav-btn" id="nav-reload" title="Reload">
          <i class="fas fa-rotate-right"></i>
        </button>
        <form class="capsule-url-field" id="capsule-url-form" action="javascript:void(0);">
          <input type="text" class="capsule-url-input" id="omnibox-input" placeholder="Search or enter address" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        </form>
        <button class="capsule-clear-btn" id="capsule-clear-btn" title="Clear">
          <i class="fas fa-times-circle"></i>
        </button>
        <button class="capsule-icon-btn capsule-heart-btn" id="capsule-bookmark-btn" title="Bookmark page">
          <svg class="heart-icon" id="capsule-bookmark-heart" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
        <button class="capsule-icon-btn" id="capsule-mic-btn" title="Voice Search">
          <i class="fas fa-microphone"></i>
        </button>
        <!-- Circular Download Progress Ball (Safari/Chrome style % circle) -->
        <button class="capsule-download-btn" id="capsule-download-btn" title="Downloads" style="display: none;" aria-label="Downloads">
          <svg class="dl-ball-svg" viewBox="0 0 28 28" width="28" height="28">
            <circle class="dl-ball-track" cx="14" cy="14" r="11" />
            <circle class="dl-ball-fill" id="dl-ball-fill" cx="14" cy="14" r="11" stroke-dasharray="69.115" stroke-dashoffset="69.115" transform="rotate(-90 14 14)" />
            <text class="dl-ball-text" id="dl-ball-text" x="14" y="14.2" text-anchor="middle" dominant-baseline="central">0%</text>
            <path class="dl-ball-check" id="dl-ball-check" d="M9.5 14.2l3 3 6-6" style="display:none;" />
          </svg>
        </button>
        <button class="capsule-shield-btn" id="capsule-shield-btn" title="CyberShield Ad Blocker">
          <div class="shield-badge-dot" id="shield-badge-dot">
            <i class="fas fa-bolt"></i>
          </div>
        </button>
        <button class="capsule-cancel-btn" id="capsule-cancel-btn">Cancel</button>
      </div>

      <!-- Layer 2: Fixed Bottom Nav Bar (Matches Reference Icons: Clock, Pushpin, Plus, [20], Circle-Ellipsis) -->
      <nav class="bottom-nav-bar" id="bottom-nav-bar">
        <button class="nav-icon-btn" id="nav-history" title="History">
          <i class="far fa-clock"></i>
        </button>
        <button class="nav-icon-btn" id="nav-bookmarks" title="Bookmarks">
          <i class="fas fa-thumbtack"></i>
        </button>
        <button class="nav-icon-btn nav-plus-btn" id="nav-new-tab" title="New Tab">
          <i class="fas fa-plus"></i>
        </button>
        <button class="nav-icon-btn" id="nav-tabs" title="Tabs">
          <div class="tab-badge" id="tab-counter-badge">1</div>
        </button>
        <button class="nav-icon-btn" id="nav-menu" title="Menu">
          <div class="circle-dots-icon">
            <i class="fas fa-ellipsis"></i>
          </div>
        </button>
      </nav>
    </div>
  </div>

  <!-- Drawers & Modals Backdrop -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>

  <!-- Actual Webpage Blurred Background Snapshot for Context Menu -->
  <div class="context-menu-bg-preview" id="context-menu-bg-preview"></div>

  <!-- Tabs Switcher Bottom Drawer (Matches Reference Screen 3) -->
  <div class="tabs-tray-container" id="tabs-tray-container">
    <div class="tabs-tray-backdrop" id="tabs-tray-backdrop"></div>
    <div class="tabs-tray-sheet" id="tabs-tray-sheet">
      <div class="sheet-handle" style="margin:8px auto 2px;"></div>
      <!-- Tab Manager Header with Title, Count & Preset Selector -->
      <div class="tabs-tray-header">
        <div class="tabs-tray-title-group">
          <span class="tabs-tray-title">Tabs</span>
          <span class="tabs-count-badge" id="tabs-tray-count">1</span>
        </div>
        <div class="tabs-preset-segmented" id="tabs-preset-segmented">
          <button class="tabs-preset-btn active" data-preset="grid" title="2-Column Grid View">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Grid</span>
          </button>
          <button class="tabs-preset-btn" data-preset="stack" title="Card Stack Carousel View">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M6 3h12"/></svg>
            <span>Stack</span>
          </button>
          <button class="tabs-preset-btn" data-preset="list" title="Compact List View">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>List</span>
          </button>
        </div>
        <button class="tabs-tray-close-all" id="tabs-close-all-btn" title="Close All Tabs">
          <i class="fas fa-trash-can"></i>
        </button>
      </div>

      <!-- Tab Cards Wrapper (dynamically styled for Grid, Stack, or List) -->
      <div class="tabs-carousel-wrapper" id="tabs-carousel-wrapper">
        <div class="tabs-carousel" id="tabs-carousel"></div>
      </div>

      <!-- Pill Search Bar -->
      <div class="tabs-search-container">
        <div class="tabs-search-box">
          <i class="fas fa-search"></i>
          <input type="text" class="tabs-search-input" id="tabs-search-input" placeholder="Search tabs" autocomplete="off">
        </div>
      </div>

      <!-- Bottom Nav Bar inside Tabs Tray (Tab icon is solid black active pill) -->
      <nav class="bottom-nav-bar tabs-bottom-nav" id="tabs-bottom-nav">
        <button class="nav-icon-btn" id="tabs-nav-history" title="History">
          <i class="far fa-clock"></i>
        </button>
        <button class="nav-icon-btn" id="tabs-nav-bookmarks" title="Bookmarks">
          <i class="fas fa-thumbtack"></i>
        </button>
        <button class="nav-icon-btn nav-plus-btn" id="tabs-nav-new-tab" title="New Tab">
          <i class="fas fa-plus"></i>
        </button>
        <button class="nav-icon-btn active" id="tabs-nav-tabs" title="Close Tabs">
          <div class="tab-badge active" id="tabs-counter-badge">1</div>
        </button>
        <button class="nav-icon-btn" id="tabs-nav-menu" title="Menu">
          <div class="circle-dots-icon">
            <i class="fas fa-ellipsis"></i>
          </div>
        </button>
      </nav>
    </div>
  </div>

  <!-- AI Copilot Bottom Sheet -->
  <div class="bottom-sheet" id="copilot-sheet"></div>

  <!-- CyberShield Privacy Advanced Bottom Sheet -->
  <div class="bottom-sheet" id="shield-sheet">
    <div class="sheet-handle-bar"><div class="sheet-handle"></div></div>
    <div class="sheet-header">
      <div class="sheet-title" style="display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; letter-spacing:-0.015em;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span>CyberShield Privacy Center</span>
      </div>
      <button class="sheet-close-pill" id="shield-sheet-close" title="Close">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-content" id="shield-sheet-content"></div>
  </div>

  <!-- Browser More Menu Bottom Sheet -->
  <div class="bottom-sheet" id="menu-sheet"></div>

  <!-- Context Menu Bottom Sheet (Press & Hold) -->
  <div class="bottom-sheet" id="context-menu-sheet"></div>

  <!-- Floating Toast Notification -->
  <div class="ocal-toast" id="ocal-toast">
    <span class="toast-icon" id="toast-icon"></span>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <!-- App Bootstrap -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
